services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-erp_password}
      MYSQL_DATABASE: ${DB_NAME:-erp}
      TZ: Asia/Kolkata
    volumes:
      - db_data:/var/lib/mysql
      # Run once on first start, in this order
      - ./database/erp_current.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/medicines.sql:/docker-entrypoint-initdb.d/02_medicines.sql:ro
      - ./database/defaults.sql:/docker-entrypoint-initdb.d/03_defaults.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${DB_PASS:-erp_password}
      DB_NAME: ${DB_NAME:-erp}
      TZ: Asia/Kolkata
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - erp_config:/var/www/html/erp/config
      - erp_uploads:/var/www/html/erp/uploads
      - erp_logs:/var/www/html/erp/logs
      - erp_json:/var/www/html/erp/assets/json

volumes:
  db_data:
  erp_config:
  erp_uploads:
  erp_logs:
  erp_json:
